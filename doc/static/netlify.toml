# Netlify configuration for zudo-bus documentation
# Serves content at /pj/zudo-bus/ base path

[build]
  publish = "build"

# Redirect root to the base path
[[redirects]]
  from = "/"
  to = "/pj/zudo-bus/"
  status = 301
  force = true

# Rewrite all requests under /pj/zudo-bus/ to serve files from root
[[redirects]]
  from = "/pj/zudo-bus/*"
  to = "/:splat"
  status = 200
  force = true

# Handle trailing slash requests
[[redirects]]
  from = "/pj/zudo-bus"
  to = "/pj/zudo-bus/"
  status = 301
  force = true
